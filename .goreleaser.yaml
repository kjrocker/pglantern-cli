version: 2

project_name: lantern

# Insurance against a stale GITEA_TOKEN in the ambient shell: with two tokens
# in the environment GoReleaser errors out instead of picking one.
force_token: github

builds:
  - id: lantern
    main: .
    binary: lantern
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X git.kehvyn.dev/kevin/pglantern-cli/internal/cli.version={{ .Version }}

archives:
  - id: lantern
    formats: [tar.gz]
    name_template: lantern_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  # Overwrite an existing release for the tag instead of failing, so re-runs
  # after a partial/failed release succeed.
  mode: replace
  github:
    owner: kjrocker
    name: pglantern-cli
