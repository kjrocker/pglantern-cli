version: 2

project_name: lantern

# Forgejo runners inject a GITHUB_TOKEN alongside our GITEA_TOKEN; force
# GoReleaser to use the Gitea one instead of erroring on multiple tokens.
force_token: gitea

gitea_urls:
  api: https://codeberg.org/api/v1/
  download: https://codeberg.org

builds:
  - id: lantern
    main: .
    binary: lantern
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X git.kehvyn.dev/kevin/pglantern-cli/internal/cli.version={{ .Version }}

archives:
  - id: lantern
    formats: [tar.gz]
    name_template: lantern_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  # Overwrite an existing release for the tag instead of failing, so re-runs
  # after a partial/failed release succeed.
  mode: replace
  gitea:
    owner: kehvyn
    name: pglantern-cli
