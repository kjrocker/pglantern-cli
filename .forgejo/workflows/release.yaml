name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: codeberg-medium
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://github.com/actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: https://github.com/goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITEA_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
